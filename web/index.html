<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ICT Club Management System</title>
  <meta name="description" content="Students, executive committee, meetings, activities, courses, attendance, club dues, reports, certificates, notes and projects — for a secondary school ICT club.">
  <meta name="theme-color" content="#111827">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234f46e5'/%3E%3Ctext x='16' y='22' font-family='Georgia,serif' font-size='15' fill='white' text-anchor='middle'%3EICT%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <!-- The whole app is drawn here. -->
  <div id="app"><div class="boot">Starting ICT Club…</div></div>

  <!-- Toasts live outside #app so a screen change never removes them. -->
  <div id="toasts" class="toasts" role="status" aria-live="polite"></div>

  <!-- Plain scripts, loaded in order. kit → net → state → widgets → fields → nav → screens → boot -->
  <script src="/js/kit.js"></script>
  <script src="/js/net.js"></script>
  <script src="/js/state.js"></script>
  <script src="/js/widgets.js"></script>
  <script src="/js/fields.js"></script>
  <script src="/js/nav.js"></script>
  <script src="/js/screens/signin.js"></script>
  <script src="/js/screens/dashboard.js"></script>
  <script src="/js/screens/list.js"></script>
  <script src="/js/screens/detail.js"></script>
  <script src="/js/screens/attendance.js"></script>
  <script src="/js/screens/reports.js"></script>
  <script src="/js/screens/settings.js"></script>
  <script src="/js/screens/verify.js"></script>
  <script src="/js/screens/certificate.js"></script>
  <script src="/js/boot.js"></script>
</body>
</html>
